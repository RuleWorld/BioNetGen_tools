name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"  # weekly, to catch breaking bngsim releases
  workflow_dispatch:

env:
  MPLBACKEND: Agg

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip list | grep -i -E "bngsim|bionetgen"
      - name: Test
        run: pytest -v

  notebooks:
    name: execute notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[notebooks]"
      - name: Execute notebooks
        working-directory: notebooks
        run: |
          for nb in *.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir "$RUNNER_TEMP/executed" \
              --ExecutePreprocessor.timeout=1800 \
              --ExecutePreprocessor.kernel_name=python3
            echo "::endgroup::"
          done
